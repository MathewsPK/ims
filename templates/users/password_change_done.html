{% extends 'base.html' %}
{% block title %}Password Changed{% endblock %}
{% block page_title %}Password Changed{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card border-0 shadow-sm text-center py-5" style="border-radius:14px;">
      <div class="card-body">
        <div style="width:60px;height:60px;border-radius:50%;background:#dcfce7;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;font-size:1.5rem;color:#16a34a;">✓</div>
        <h5 class="fw-bold">Password updated!</h5>
        <p class="text-muted">Your password has been changed successfully.</p>
        <a href="{% url 'dashboard:dashboard' %}" class="btn btn-primary">Back to Dashboard</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
