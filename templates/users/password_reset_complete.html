{% extends 'base.html' %}
{% block auth_content %}
<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IMS</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:linear-gradient(135deg,#0f172a 0%,#1e3a5f 100%);min-height:100vh;}
.auth-card-light { color:#0f172a; }
.auth-card-light .text-muted { color:#64748b !important; }

</head><body class="d-flex align-items-center justify-content-center">
