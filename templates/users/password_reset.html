{% extends 'base.html' %}
{% block auth_content %}
<!DOCTYPE html><html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password — IMS</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:linear-gradient(135deg,#0f172a 0%,#1e3a5f 100%);min-height:100vh;}
/* This card is always a fixed white panel regardless of the app's light/dark mode setting —
   force readable colors on its contents so global dark-mode text-color rules don't leak in. */
.auth-card-light, .auth-card-light .form-label { color:#0f172a; }
.auth-card-light .text-muted { color:#64748b !important; }
.auth-card-light .form-control {
  background:#f8fafc !important; color:#0f172a !important; border-color:#e2e8f0 !important;
}
</style>
</head><body class="d-flex align-items-center justify-content-center">
<div style="width:100%;max-width:420px;padding:1rem;">
  <div class="auth-card-light" style="background:#fff;border-radius:20px;box-shadow:0 25px 60px rgba(0,0,0,.35);padding:2.5rem;">
    <h4 class="fw-bold mb-2">Reset Password</h4>
    <p class="text-muted small mb-4">Enter your email to receive reset instructions.</p>
    {% if form.non_field_errors %}<div class="alert alert-danger small">{{ form.non_field_errors }}</div>{% endif %}
    <form method="post">{% csrf_token %}
      <div class="mb-3">
        <label class="form-label fw-semibold small">Email</label>
        <input type="email" name="email" class="form-control" required autofocus>
      </div>
      <button type="submit" class="btn btn-primary w-100">Send Reset Link</button>
    </form>
    <div class="text-center mt-3"><a href="{% url 'users:login' %}" class="small text-muted">← Back to login</a></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
{% endblock %}
