{% extends 'base.html' %}
{% block title %}Confirm Delete{% endblock %}
{% block page_title %}Confirm Delete{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card border-danger" style="border-radius:14px;">
      <div class="card-body text-center py-5">
        <div style="width:60px;height:60px;border-radius:50%;background:#fee2e2;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;">
          <i class="bi bi-trash text-danger" style="font-size:1.5rem;"></i>
        </div>
        <h5 class="fw-bold mb-2">Delete Confirmation</h5>
        <p class="text-muted">
          Are you sure you want to delete
          <strong>{{ object }}</strong>?
          This action <strong>cannot be undone</strong>.
        </p>
        <form method="post" class="d-flex gap-3 justify-content-center mt-4">
          {% csrf_token %}
          <a href="{{ request.META.HTTP_REFERER|default:'/' }}" class="btn btn-outline-secondary px-4">Cancel</a>
          <button type="submit" class="btn btn-danger px-4"><i class="bi bi-trash me-1"></i>Yes, Delete</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
